<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Happy Birthday</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  overflow: hidden;
}

/* CONTAINER */
.app {
  text-align: center;
}

/* GIFT BOX */
.gift-box {
  position: relative;
  width: 160px;
  height: 160px;
  cursor: pointer;
  margin: auto;
}

.box {
  position: absolute;
  bottom: 0;
  width: 160px;
  height: 120px;
  background: linear-gradient(145deg, #ff4d6d, #ff758f);
  border-radius: 0 0 12px 12px;
}

.lid {
  position: absolute;
  top: 0;
  width: 160px;
  height: 50px;
  background: linear-gradient(145deg, #ff8fab, #ff4d6d);
  border-radius: 12px 12px 6px 6px;
  transition: transform 0.8s ease;
}

.ribbon {
  position: absolute;
  width: 20px;
  height: 160px;
  background: gold;
  left: 50%;
  transform: translateX(-50%);
}

.ribbon::after {
  content: '';
  position: absolute;
  top: 45px;
  left: -60px;
  width: 140px;
  height: 20px;
  background: gold;
}

/* OPEN STATE */
.open .lid {
  transform: translateY(-80px) rotate(-10deg);
}

/* MESSAGE */
.message {
  margin-top: 40px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 1s ease;
}

.message.show {
  opacity: 1;
  transform: translateY(0);
}

.message h1 {
  font-size: 28px;
  margin-bottom: 12px;
}

.message p {
  font-size: 16px;
  line-height: 1.6;
  opacity: 0.9;
}

/* CONFETTI */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  background: hsl(var(--hue), 80%, 60%);
  top: -10px;
  left: var(--x);
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

/* FOOTER */
.footer {
  position: fixed;
  bottom: 12px;
  width: 100%;
  text-align: center;
  font-size: 12px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="app">
  <div class="gift-box" id="gift">
    <div class="lid"></div>
    <div class="box"></div>
    <div class="ribbon"></div>
  </div>

  <div class="message" id="message">
    <h1>🎉 Selamat Ulang Tahun 🎉</h1>
    <p>
      Semoga hari ini penuh senyum,<br>
      langkahmu makin ringan,<br>
      dan semua hal baik pelan-pelan<br>
      datang ke hidupmu 💖
    </p>
  </div>
</div>

<div class="footer">
  Made with ❤️ by someone who cares
</div>

<!-- AUDIO -->
<audio id="music" src="music.mp3"></audio>

<script>
const gift = document.getElementById('gift');
const message = document.getElementById('message');
const music = document.getElementById('music');

let opened = false;

gift.addEventListener('click', () => {
  if (opened) return;
  opened = true;

  gift.classList.add('open');
  setTimeout(() => {
    message.classList.add('show');
    music.play().catch(()=>{});
    launchConfetti();
  }, 700);
});

/* CONFETTI GENERATOR */
function launchConfetti() {
  for (let i = 0; i < 40; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.setProperty('--x', Math.random() * 100 + 'vw');
    confetti.style.setProperty('--hue', Math.random() * 360);
    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
    document.body.appendChild(confetti);

    setTimeout(() => confetti.remove(), 5000);
  }
}
</script>

</body>
</html>
